app:
  max-pages: 100
  chunk-tokens: 3000
  chat:
    result-row-limit: 200
    max-prompt-length: 2000
    max-tool-call-rounds: 10
    query-timeout-ms: 10000
    history-window: 20
  routing:
    # Intent gate (TypeSafe Jev). On in this file (the code treats a missing flag as off). When enabled, the prompt AND
    # recent conversation history (including assistant answers built from graph rows) are sent to OpenRouter's System One
    # endpoint. Connection settings are under spring.ai.typesafe.
    enabled: true
    block-threshold: 0.9
  judge:
    # Answer judge (TypeSafe Jev JevJudge). On in this file (the code treats a missing flag as off). When enabled, every
    # agent answer sends the conversation history, the retrieved graph rows and the answer to OpenRouter's System One
    # endpoint to be scored. Advisory only.
    enabled: true
    max-evidence-chars: 8000
  models:
    extract:
      # Active: OpenRouter (OpenAI-compatible) for faster, genuinely-parallel extraction.
      base-url: https://openrouter.ai/api/v1
      api-key: ${OPENAI_API_KEY}
      model: stealth/space-bunny-alpha
#      model: z-ai/glm-5.3-flash
      temperature: 0.1
      timeout: 600s
      max-retries: 5
      pool-size: 8
      # Previous local-Ollama config (rollback target):
      # base-url: http://localhost:11434/v1
      # api-key: ${EXTRACT_API_KEY:ollama}
      # model: qwen3.8:27b-mlx
      # pool-size: 2
    chat:
      base-url: https://openrouter.ai/api/v1
      api-key: ${OPENAI_API_KEY}
      model: stealth/space-bunny-alpha
#      model: z-ai/glm-5.3-flash
#      base-url: https://opencode.ai/zen/go/v1
#      model: glm-5.3-flash
#      model: glm-5.3
#      model: glm-5.2
#      model: qwen3.8-max
#      model: qwen3.8-flash
#      model: kimi-k3
#      base-url: http://localhost:11434/v1
#      api-key: ${EXTRACT_API_KEY:ollama}
#      model: qwen3.8:27b-mlx
      temperature: 0.2
      timeout: 120s
      max-retries: 5

spring:
  ai:
    typesafe:
      # One shared TypeSafeClient (spring-ai-starter-typesafe) for the intent gate and the answer judge.
      api-key: ${OPENAI_API_KEY}
      base-url: https://openrouter.ai/api   # the SDK appends /v1/systemone
      model: typesafe/jev-1.13              # pinned, not jev-latest
      timeout: 3s                           # per attempt
      retry:
        max-retries: 1
        total-timeout: 5s                   # includes the next attempt's HTTP timeout
    openai:
      # Feeds Spring AI's auto-configured OpenAI beans (audio/image/moderation), which
      # hard-fail context startup when no credential is resolvable. The app's own chat and
      # extraction models are configured under app.models above.
      api-key: ${OPENAI_API_KEY}
  web:
    resources:
      cache:
        cachecontrol:
          # Static UI files change with the app; revalidate every load so browsers never keep a stale index.html/CSS.
          no-cache: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: jdbc:h2:file:./data/chatdb
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
  neo4j:
    uri: bolt://localhost:7687
    authentication:
      username: neo4j
      password: ${NEO4J_PASSWORD:neo4j-admin}

server:
  address: 127.0.0.1
  port: 8080

logging:
  level:
    net.jimmykw.knowledgegraph: DEBUG
