app:
  max-pages: 100
  chunk-tokens: 3000
  chat:
    result-row-limit: 200
    max-prompt-length: 2000
    max-tool-call-rounds: 10
    query-timeout-ms: 10000
    history-window: 20
  models:
    extract:
      # Active: hosted GLM 5.2 (OpenAI-compatible) for faster, genuinely-parallel extraction.
      base-url: https://opencode.ai/zen/go/v1
      api-key: ${OPENAI_API_KEY}
      model: glm-5.2
      temperature: 0.1
      timeout: 600s
      max-retries: 5
      pool-size: 8
      # Previous local-Ollama config (rollback target):
      # base-url: http://localhost:11434/v1
      # api-key: ${EXTRACT_API_KEY:ollama}
      # model: qwen3.8:27b-mlx
      # pool-size: 2
    chat:
      base-url: https://opencode.ai/zen/go/v1
      api-key: ${OPENAI_API_KEY}
      model: glm-5.2
      temperature: 0.2
      timeout: 120s
      max-retries: 5

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: jdbc:h2:file:./data/chatdb
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
  neo4j:
    uri: bolt://localhost:7687
    authentication:
      username: neo4j
      password: ${NEO4J_PASSWORD:neo4j-admin}

server:
  address: 127.0.0.1
  port: 8080

logging:
  level:
    net.jimmykw.knowledgegraph: DEBUG
